name: Awesome-Daily-OpenSource Curator

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🚚 Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🤖 Run GitCurator Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run curate

      - name: 🚀 Commit & Push changes
        run: |
          git config --global user.name "GitCurator Bot"
          git config --global user.email "bot@gitcurator.dev"
          git add README.md archives/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daily): 📅 archive & update 15 curated repos [skip ci]" && git push)
